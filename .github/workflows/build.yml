name: Build WineCX

on:
  workflow_dispatch:
    inputs:
      winecx_version:
        description: "WineCX source version"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build WineCX (${{ matrix.build_type }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: wow64
            configure_flags: "--enable-archs=i386,x86_64"
            packages: >
              gcc-multilib libc6-dev-i386 gcc-mingw-w64 mingw-w64
              libasound2-dev bluez libdbus-1-dev libpulse-dev
              libfontconfig-dev libfreetype-dev libgnutls28-dev
              libgl-dev libunwind-dev libx11-dev libxcomposite-dev
              libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev
              libxrender-dev libxext-dev libwayland-bin libwayland-dev
              libxkbcommon-dev libxkbregistry-dev libegl-dev
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
              libsdl2-dev libudev-dev libvulkan-dev libcups2-dev
              libgphoto2-dev libsane-dev libkrb5-dev samba-dev
              smbclient ocl-icd-opencl-dev libpcap-dev libusb-1.0-0-dev
              libv4l-dev flex bison libx11-dev:i386
              gettext libpcsclite-dev libpcsclite-dev:i386 libavcodec-dev libavcodec-dev:i386 libavformat-dev libavformat-dev:i386 libavutil-dev libavutil-dev:i386 libswresample-dev libswresample-dev:i386 libswscale-dev libswscale-dev:i386 libcapi20-dev libcapi20-dev:i386 samba-dev

          - build_type: 64bitonly
            configure_flags: "--enable-win64"
            packages: >
              gcc-multilib libc6-dev-i386 gcc-mingw-w64 mingw-w64
              libasound2-dev bluez libdbus-1-dev libpulse-dev
              libfontconfig-dev libfreetype-dev libgnutls28-dev
              libgl-dev libunwind-dev libx11-dev libxcomposite-dev
              libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev
              libxrender-dev libxext-dev libwayland-bin libwayland-dev
              libxkbcommon-dev libxkbregistry-dev libegl-dev
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
              libsdl2-dev libudev-dev libvulkan-dev libcups2-dev
              libgphoto2-dev libsane-dev libkrb5-dev samba-dev
              smbclient ocl-icd-opencl-dev libpcap-dev libusb-1.0-0-dev
              libv4l-dev flex bison
              gettext libpcsclite-dev libpcsclite-dev:i386 libavcodec-dev libavcodec-dev:i386 libavformat-dev libavformat-dev:i386 libavutil-dev libavutil-dev:i386 libswresample-dev libswresample-dev:i386 libswscale-dev libswscale-dev:i386 libcapi20-dev libcapi20-dev:i386 samba-dev

          - build_type: 32bitonly
            configure_flags: ""
            packages: >
              gcc-multilib libc6-dev-i386 gcc-mingw-w64 mingw-w64 flex bison
              libasound2-dev:i386 bluez libdbus-1-dev:i386 libpulse-dev:i386
              libfontconfig-dev:i386 libfreetype-dev:i386 libgnutls28-dev:i386
              libgl-dev:i386 libunwind-dev:i386 libx11-dev:i386 libxcomposite-dev:i386
              libxcursor-dev:i386 libxfixes-dev:i386 libxi-dev:i386 libxrandr-dev:i386
              libxrender-dev:i386 libxext-dev:i386 libwayland-bin libwayland-dev:i386
              libxkbcommon-dev:i386 libxkbregistry-dev:i386 libegl-dev:i386
              libgstreamer1.0-dev:i386 libgstreamer-plugins-base1.0-dev:i386
              libsdl2-dev:i386 libudev-dev:i386 libvulkan-dev:i386 libcups2-dev:i386
              libgphoto2-dev:i386 libsane-dev:i386 libkrb5-dev:i386 ocl-icd-opencl-dev:i386
              libpcap-dev:i386 libusb-1.0-0-dev:i386 libv4l-dev:i386
              gettext libpcsclite-dev libpcsclite-dev:i386 libavcodec-dev libavcodec-dev:i386 libavformat-dev libavformat-dev:i386 libavutil-dev libavutil-dev:i386 libswresample-dev libswresample-dev:i386 libswscale-dev libswscale-dev:i386 libcapi20-dev libcapi20-dev:i386 samba-dev:i386

    env:
      WINECX_VERSION: ${{ inputs.winecx_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y ${{ matrix.packages }}

      - name: Download WineCX source
        run: |
          wget -O crossover-sources-${WINECX_VERSION}.tar.gz https://media.codeweavers.com/pub/crossover/source/crossover-sources-${WINECX_VERSION}.tar.gz
          tar -xzf crossover-sources-${WINECX_VERSION}.tar.gz

      - name: Configure WineCX
        run: |
          cp "${GITHUB_WORKSPACE}"/distversion.h "${GITHUB_WORKSPACE}"/sources/wine/programs/winedbg/distversion.h
          cd sources/wine
          ./configure ${{ matrix.configure_flags }} --prefix=/

      - name: Compile WineCX
        run: |
          cd sources/wine
          make -j"$(nproc)"

      - name: Install WineCX
        run: |
          cd sources/wine
          make install DESTDIR="$GITHUB_WORKSPACE/winecx"

      - name: Create tar.xz archive
        id: archive
        run: |
          ARCHIVE="winecx-crossover-${WINECX_VERSION}-${{ matrix.build_type }}.tar.xz"
          mkdir -p $GITHUB_WORKSPACE/dist
          tar -cJf "$GITHUB_WORKSPACE/dist/$ARCHIVE" -C "$GITHUB_WORKSPACE/winecx" .
          cd $GITHUB_WORKSPACE/dist
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256sum"
          md5sum "$ARCHIVE" > "$ARCHIVE.md5sum"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: winecx-builds-${{ matrix.build_type }}
          path: dist/*
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Get Platform Codename
        id: platform
        run: |
          UBUNTU_CODENAME=$(grep '^UBUNTU_CODENAME=' /etc/os-release | cut -d'=' -f2 | tr -d '"')
          echo "codename=$UBUNTU_CODENAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: winecx-${{ inputs.winecx_version }}
          name: ${{ inputs.winecx_version }}
          body: |
            WineCX Crossover ${{ inputs.winecx_version }}
            - Build Environment: Ubuntu ${{ steps.platform.outputs.codename }}
            - Source: https://media.codeweavers.com/pub/crossover/source/crossover-sources-${{ inputs.winecx_version }}.tar.gz
          overwrite_files: true
          files: |
            dist/*.tar.xz
            dist/*.sha256sum
            dist/*.md5sum
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}